[workspace]
resolver = "3"
members = ["crates/core", "crates/ipc", "crates/daemon", "crates/cli"]
# crates/gui is added at milestone 7 (GTK4 deps not needed before then).

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
