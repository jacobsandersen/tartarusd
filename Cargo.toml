[workspace]
resolver = "3"
members = ["crates/core", "crates/ipc", "crates/daemon", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.4.1"
edition = "2024"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
