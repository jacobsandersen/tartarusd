tartarusd-core = { path = "../core" }
tartarusd-ipc = { path = "../ipc" }
tokio = { version = "1.54.1", features = ["rt", "macros", "signal"] }
zbus = "6.3.0"

[dev-dependencies]
tempfile = "3.27.0"
