[package]
name = "tartarusd-gui"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "tartarusd-gui"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
futures-util = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
tartarusd-core = { path = "../core" }
tartarusd-ipc = { path = "../ipc" }
thiserror.workspace = true
toml.workspace = true
zbus = "6.3.0"

[features]
# Show the window-matching (automatic switching) section. Build it together with the
# daemon's feature of the same name; without a window backend the rules do nothing.
hyprland = []

[dev-dependencies]
tempfile = "3.27.0"
